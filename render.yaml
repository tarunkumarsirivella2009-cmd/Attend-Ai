services:
  - type: web
    name: attend-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FRONTEND_URL
        value: https://attend-ai.vercel.app
      - key: DATABASE_URL
        value: sqlite:///./attendai.db
      - key: ATTENDAI_SECRET_KEY
        generateValue: true
